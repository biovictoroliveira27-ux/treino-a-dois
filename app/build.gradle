plugins {
    id 'com.android.application'
}

def signing = new Properties()
def signingFile = rootProject.file('keystore/signing.properties')
if (signingFile.exists()) signing.load(new FileInputStream(signingFile))

android {
    namespace 'com.treinoadois.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.treinoadois.app"
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName "2.1"
    }

    signingConfigs {
        release {
            storeFile file(signing['storeFile'])
            storePassword signing['storePassword']
            keyAlias signing['keyAlias']
            keyPassword signing['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
