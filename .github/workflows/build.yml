name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Baixar Firebase JS
        run: |
          mkdir -p app/src/main/assets/vendor
          for f in app auth firestore; do
            curl -fsSL "https://www.gstatic.com/firebasejs/10.14.1/firebase-$f-compat.js" -o "app/src/main/assets/vendor/firebase-$f-compat.js"
          done
          ls -la app/src/main/assets/vendor

      - name: Baixar fontes (funcionam sem internet)
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          curl -fsSL -A "$UA" "https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" -o /tmp/fonts.css
          python3 - <<'PY'
          import re, urllib.request, os
          css = open('/tmp/fonts.css').read()
          out_dir = 'app/src/main/assets/vendor/fonts'; os.makedirs(out_dir, exist_ok=True)
          blocks = re.findall(r'/\* ([a-z-]+) \*/\s*(@font-face\s*\{[^}]*\})', css)
          keep = []
          for k,(subset, block) in enumerate(blocks):
              if subset not in ('latin', 'latin-ext'): continue
              url = re.search(r'url\((https://[^)]+)\)', block).group(1)
              name = f'f{k}.woff2'
              urllib.request.urlretrieve(url, f'{out_dir}/{name}')
              keep.append(block.replace(url, 'fonts/' + name))
          open('app/src/main/assets/vendor/fonts.css', 'w').write('\n'.join(keep))
          print(len(keep), 'fontes')
          PY

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            msg=$(grep -A 25 -E "What went wrong|error:|ERROR:" build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Erro na compilacao::$msg"
            exit 1
          }

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk TreinoADois.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TreinoADois-apk
          path: TreinoADois.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.${{ github.run_number }}
          name: Treino a Dois ${{ github.run_number }}
          files: TreinoADois.apk
