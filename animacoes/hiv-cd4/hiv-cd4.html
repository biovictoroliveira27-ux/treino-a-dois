<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIV em linfócito T CD4</title>
<style>
  html,body{margin:0;height:100%;background:#000;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;width:min(100vw,177.78vh);height:auto;aspect-ratio:16/9;}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Animação: infecção de um linfócito T CD4+ pelo HIV-1 e ciclo de replicação (20 s).
// render(t) é determinística — usada tanto para tocar no navegador quanto para gerar o vídeo.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720, SC = cv.width / W, DUR = 20;
const TAU = Math.PI * 2;
const FONT = 'Inter, "DejaVu Sans", Arial, sans-serif';
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const win = (t, a, b, f = 0.25) => Math.min(ss(a, a + f, t), 1 - ss(b - f, b, t));
const deg = d => d * Math.PI / 180;
const polar = (c, r, a) => ({ x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- paleta ----------
const COL = {
  gp120: '#ffd166', gp41: '#c3cbd8', cd4: '#4ea8ff', ccr5: '#43d39e',
  capsid: '#f4a259', rna: '#ff4d6d', dna: '#c77dff', host: '#7fb0e6',
  rt: '#5eead4', in: '#a3e635', pr: '#f472b6', ma: '#93c5fd', nc: '#fb7185',
  head: '#f3e3b3', tail: 'rgba(214,170,100,.55)', escrt: '#a78bfa'
};

// ---------- mundo ----------
const C = { x: 820, y: 400 }, R = 470, RV = 46;          // célula e raio do vírion
const N = { x: 930, y: 400 }, RN = 170;                  // núcleo
const PORES = [180, 215, 150, 250, 290, 330, 15, 60, 105].map(deg);
const TH_CD4 = Math.PI - 0.055, TH_CCR5 = Math.PI + 0.06;
const TH_BUD = deg(215);
const BUD_SITE = polar(C, R, TH_BUD);
const PORE_IN = polar(N, RN, Math.PI), PORE_OUT = polar(N, RN, deg(215));
const EXTRA_BUDS = [[232, 15.5], [250, 15.9], [196, 16.4], [182, 16.9], [266, 17.4]];
const DECOR_RECEPTORS = [128, 137, 153, 168, 190, 205, 224, 241, 258, 268];

// partículas estáticas
const R0 = rng(7);
const PARTICLES = Array.from({ length: 160 }, () => ({ x: -300 + R0() * 1900, y: -300 + R0() * 1300, r: 0.6 + R0() * 1.8, a: 0.15 + R0() * 0.35 }));
const CYTO = Array.from({ length: 260 }, () => { const a = R0() * TAU, r = Math.sqrt(R0()) * (R - 20); return { x: C.x + r * Math.cos(a), y: C.y + r * Math.sin(a), r: 0.8 + R0() * 2.2, a: 0.08 + R0() * 0.2 }; }).filter(p => dist(p, N) > RN + 8);
const CHROM = Array.from({ length: 14 }, () => { const a = R0() * TAU, r = R0() * (RN - 40); return { x: N.x + r * Math.cos(a), y: N.y + r * Math.sin(a), ph: R0() * TAU, len: 30 + R0() * 50, ang: R0() * TAU }; });
const RNA_TANGLE = (() => { const r = rng(11); const pts = []; let x = 0, y = 0, a = 0; for (let i = 0; i < 46; i++) { a += (r() - .5) * 1.6; x += Math.cos(a) * 3; y += Math.sin(a) * 3; const d = Math.hypot(x, y); if (d > 13) { x *= 13 / d; y *= 13 / d; a += Math.PI * .7; } pts.push([x, y]); } return pts; })();

// ---------- câmera ----------
const CAM = [[0, 150, 392, 2.6], [2.7, 200, 395, 2.5], [3.6, 285, 400, 2.3], [5.0, 300, 398, 2.3], [6.6, 395, 398, 2.15],
  [7.0, 420, 400, 2.2], [9.6, 740, 405, 2.2], [10.3, 850, 420, 2.1], [11.9, 865, 420, 2.1], [12.6, 840, 380, 1.75],
  [13.6, 700, 300, 1.55], [14.6, 520, 200, 1.9], [15.1, 470, 165, 2.3], [16.9, 455, 150, 2.3], [17.8, 420, 128, 2.2],
  [18.8, 590, 290, 0.92], [20, 600, 290, 0.88]];
function camAt(t) {
  for (let i = 0; i < CAM.length - 1; i++) {
    const a = CAM[i], b = CAM[i + 1];
    if (t <= b[0]) { const k = ss(a[0], b[0], t); return { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k), z: Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), k)) }; }
  }
  const l = CAM[CAM.length - 1]; return { x: l[1], y: l[2], z: l[3] };
}
let cam = camAt(0);
const toScreen = p => ({ x: (p.x - cam.x) * cam.z + W / 2, y: (p.y - cam.y) * cam.z + H / 2 });
const worldT = () => ctx.setTransform(SC * cam.z, 0, 0, SC * cam.z, SC * (W / 2 - cam.x * cam.z), SC * (H / 2 - cam.y * cam.z));
const screenT = () => ctx.setTransform(SC, 0, 0, SC, 0, 0);

// ---------- utilitários de desenho ----------
function bilayer(cx, cy, r, hidden, o = {}) {
  const sp = o.sp || 6.2, n = Math.max(14, Math.round(TAU * r / sp)), h = o.h || 4.2, hr = o.hr || 2.05;
  const tails = new Path2D(), heads = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, c = Math.cos(a), s = Math.sin(a);
    if (hidden && hidden(cx + r * c, cy + r * s)) continue;
    const xi = cx + (r - h) * c, yi = cy + (r - h) * s, xo = cx + (r + h) * c, yo = cy + (r + h) * s;
    tails.moveTo(xi, yi); tails.lineTo(cx + (r - .5) * c, cy + (r - .5) * s);
    tails.moveTo(cx + (r + .5) * c, cy + (r + .5) * s); tails.lineTo(xo, yo);
    heads.moveTo(xi + hr, yi); heads.arc(xi, yi, hr, 0, TAU);
    heads.moveTo(xo + hr, yo); heads.arc(xo, yo, hr, 0, TAU);
  }
  ctx.strokeStyle = o.tail || COL.tail; ctx.lineWidth = o.tw || 1.5; ctx.stroke(tails);
  ctx.fillStyle = o.head || COL.head; ctx.fill(heads);
}
function blob(x, y, r, col, a = 1) {
  if (a <= 0) return;
  const ga = ctx.globalAlpha; ctx.globalAlpha = ga * a;
  const g = ctx.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.35, col); g.addColorStop(1, shade(col, -40));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = ga;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp((n >> 8 & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function glow(x, y, r, col, a) {
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, .75 * a)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function helix(x0, x1, y, amp, ph, colA, colB, rung, lw = 1.6) {
  if (x1 <= x0) return;
  ctx.strokeStyle = rung; ctx.lineWidth = .9; ctx.beginPath();
  for (let x = Math.ceil(x0 / 3.2) * 3.2; x <= x1; x += 3.2) { const a = Math.sin(x * .2 + ph) * amp; ctx.moveTo(x, y + a); ctx.lineTo(x, y - a); }
  ctx.stroke();
  const n = Math.max(2, Math.ceil((x1 - x0) / 1.5));
  for (const [sg, col] of [[1, colA], [-1, colB]]) {
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
    for (let i = 0; i <= n; i++) { const x = lerp(x0, x1, i / n), yy = y + sg * Math.sin(x * .2 + ph) * amp; i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
    ctx.stroke();
  }
}
function polyAt(pts, k) {
  const seg = []; let tot = 0;
  for (let i = 0; i < pts.length - 1; i++) { const d = dist(pts[i], pts[i + 1]); seg.push(d); tot += d; }
  let L = clamp(k) * tot;
  for (let i = 0; i < seg.length; i++) {
    if (L <= seg[i] || i === seg.length - 1) {
      const u = seg[i] ? clamp(L / seg[i]) : 0, a = pts[i], b = pts[i + 1];
      return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), a: Math.atan2(b.y - a.y, b.x - a.x) };
    }
    L -= seg[i];
  }
}
function squiggle(x, y, a, len, col, lw, ph, amp = 1.8, cap = false, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(a);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i <= 24; i++) { const u = -len + len * i / 24; const yy = Math.sin(u * .45 + ph) * amp; i ? ctx.lineTo(u, yy) : ctx.moveTo(u, yy); }
  ctx.stroke();
  if (cap) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, Math.sin(ph) * amp, lw * 1.1, 0, TAU); ctx.fill(); }
  ctx.restore();
}

// ---------- receptores ----------
function cd4(th, tip, a = 1, hl = 0) {
  const n = { x: Math.cos(th), y: Math.sin(th) }, b = polar(C, R, th);
  tip = tip || { x: b.x + n.x * 44, y: b.y + n.y * 44 };
  const cp = { x: b.x + n.x * 26, y: b.y + n.y * 26 };
  ctx.save(); ctx.globalAlpha *= a;
  glow((b.x + tip.x) / 2, (b.y + tip.y) / 2, 34, COL.cd4, hl);
  ctx.strokeStyle = shade(COL.cd4, -30); ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(b.x - n.x * 14, b.y - n.y * 14); ctx.lineTo(b.x + n.x * 4, b.y + n.y * 4); ctx.stroke(); // TM + cauda
  const q = u => ({ x: (1 - u) * (1 - u) * (b.x + n.x * 6) + 2 * (1 - u) * u * cp.x + u * u * tip.x, y: (1 - u) * (1 - u) * (b.y + n.y * 6) + 2 * (1 - u) * u * cp.y + u * u * tip.y });
  for (let i = 0; i < 4; i++) {
    const u = (i + .55) / 4, p = q(u), p2 = q(u + .02), ang = Math.atan2(p2.y - p.y, p2.x - p.x);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
    const g = ctx.createLinearGradient(0, -5, 0, 5); g.addColorStop(0, '#bfe0ff'); g.addColorStop(1, COL.cd4);
    ctx.fillStyle = g; ctx.strokeStyle = shade(COL.cd4, -50); ctx.lineWidth = .8;
    ctx.beginPath(); ctx.ellipse(0, 0, 5.6, 4.4, 0, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}
function ccr5(th, a = 1, hl = 0) {
  const n = { x: Math.cos(th), y: Math.sin(th) }, tg = { x: -n.y, y: n.x }, b = polar(C, R, th);
  ctx.save(); ctx.globalAlpha *= a;
  glow(b.x, b.y, 26, COL.ccr5, hl);
  ctx.strokeStyle = COL.ccr5; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 7; i++) {
    const s = (i - 3.5) * 3.2, out = i % 2 === 0 ? 9 : -8;
    const p = { x: b.x + tg.x * s + n.x * out, y: b.y + tg.y * s + n.y * out };
    if (i === 0) ctx.moveTo(b.x + tg.x * (s - 2) + n.x * 12, b.y + tg.y * (s - 2) + n.y * 12);
    ctx.lineTo(p.x, p.y);
  }
  ctx.stroke(); ctx.restore();
}

// ---------- vírion / capsídeo ----------
const CAPSID = (() => { const p = new Path2D(); p.moveTo(24, -6.5); p.quadraticCurveTo(31, 0, 24, 6.5); p.lineTo(-20, 17); p.quadraticCurveTo(-34, 0, -20, -17); p.closePath(); return p; })();
const hw = x => lerp(17, 6.5, clamp((x + 20) / 44));
function capsid(x, y, rot, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha *= a;
  const s = o.scale ?? 1; ctx.scale(s, s);
  const g = ctx.createLinearGradient(0, -17, 0, 17);
  g.addColorStop(0, rgba(COL.capsid, .55)); g.addColorStop(.5, rgba(COL.capsid, .28)); g.addColorStop(1, rgba(COL.capsid, .55));
  ctx.fillStyle = g; ctx.fill(CAPSID);
  ctx.save(); ctx.clip(CAPSID);
  ctx.strokeStyle = rgba(COL.capsid, .8); ctx.lineWidth = .55; ctx.beginPath();
  for (let j = -5; j <= 5; j++) for (let i = -9; i <= 8; i++) {
    const cx = i * 4.6 + (j & 1) * 2.3, cy = j * 4;
    for (let k = 0; k <= 6; k++) { const an = k * TAU / 6 + Math.PI / 6, px = cx + 2.55 * Math.cos(an), py = cy + 2.55 * Math.sin(an); k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  }
  ctx.stroke(); ctx.restore();
  ctx.strokeStyle = COL.capsid; ctx.lineWidth = 1.4; ctx.stroke(CAPSID);
  // genoma
  const rt = o.rt || 0, ph = o.ph || 0;
  const strand = (off, x0, x1, col, lw) => {
    if (x1 <= x0) return;
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();
    for (let i = 0; i <= 30; i++) { const xx = lerp(x0, x1, i / 30); const yy = off * hw(xx) * .4 + 1.5 * Math.sin(xx * .7 + ph + off); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
    ctx.stroke();
  };
  const rnaA = 1 - ss(.55, 1, rt);
  ctx.globalAlpha *= 1;
  ctx.save(); ctx.globalAlpha *= rnaA; strand(-1, -24, 21, COL.rna, 1.3); strand(1, -24, 21, COL.rna, 1.3); ctx.restore();
  if (rt > 0) {
    strand(-.55, -24, lerp(-24, 21, ss(0, .6, rt)), COL.dna, 1.3);
    strand(-.15, -24, lerp(-24, 21, ss(.55, 1, rt)), COL.dna, 1.3);
  }
  if (o.enz !== false) {
    blob(-8, 9, 2.7, COL.rt); blob(6 + 10 * Math.sin(rt * Math.PI) * (rt > 0 ? 1 : 0), -7, 2.7, COL.rt);
    blob(3, 9, 2.4, COL.in); blob(13, 3.5, 2.4, COL.in);
    blob(-15, -8, 2.2, COL.pr);
  }
  ctx.restore();
}
const outsideCellClip = () => { const p = new Path2D(); p.rect(-5000, -5000, 10000, 10000); p.moveTo(C.x + R, C.y); p.arc(C.x, C.y, R, 0, TAU); ctx.clip(p, 'evenodd'); };
const inCell = (x, y) => Math.hypot(x - C.x, y - C.y) < R;
function spikeAt(v, k) { const a = v.rot + k * TAU / v.nSp; return { a, base: polar(v, RV, a), tip: polar(v, RV + 14, a) }; }
function nearestSpike(v, ang) { let best = 0, bd = 9; for (let k = 0; k < v.nSp; k++) { let d = Math.abs(((v.rot + k * TAU / v.nSp - ang) % TAU + TAU + Math.PI) % TAU - Math.PI); if (d < bd) { bd = d; best = k; } } return spikeAt(v, best); }
function drawVirion(v) {
  const asm = v.asm ?? 1, mat = v.mature ?? 1, al = v.alpha ?? 1;
  ctx.save(); ctx.globalAlpha *= al;
  // interior (apenas fora da célula)
  ctx.save(); outsideCellClip();
  const g = ctx.createRadialGradient(v.x - 14, v.y - 14, 4, v.x, v.y, RV);
  g.addColorStop(0, 'rgba(58,78,128,.9)'); g.addColorStop(1, 'rgba(22,30,62,.95)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(v.x, v.y, RV, 0, TAU); ctx.fill();
  if (mat > 0) { // matriz p17
    ctx.fillStyle = rgba(COL.ma, .9 * mat);
    for (let k = 0; k < 40; k++) { const p = polar(v, RV - 7.5, v.rot + k * TAU / 40); ctx.beginPath(); ctx.arc(p.x, p.y, 1.7, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
  // Gag imaturo (raios MA–CA–NC) e RNA central
  if (mat < 1 && asm > 0) {
    const ga = 1 - mat, n = 34, out = { x: Math.cos(v.dirOut ?? v.rot), y: Math.sin(v.dirOut ?? v.rot) };
    const baseA = Math.atan2(out.y, out.x);
    for (let k = 0; k < n; k++) {
      const a = baseA + (k / n - .5) * TAU, rel = Math.abs(k / n - .5) * 2; // 0 = topo do broto
      if (1 - rel > asm * 1.02) continue;
      const seg = (r0, r1, col, lw) => { const p0 = polar(v, r0, a), p1 = polar(v, r1, a); ctx.strokeStyle = rgba(col, ga); ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke(); };
      ctx.lineCap = 'round';
      seg(RV - 5.5, RV - 9.5, COL.ma, 3.2); seg(RV - 10.5, RV - 17, COL.capsid, 3.6); seg(RV - 18, RV - 21.5, COL.nc, 2.6);
    }
    ctx.save(); ctx.globalAlpha *= ga * asm; ctx.translate(v.x, v.y); ctx.rotate(v.rot);
    ctx.strokeStyle = COL.rna; ctx.lineWidth = 1.2; ctx.beginPath(); RNA_TANGLE.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    ctx.rotate(2.1); ctx.beginPath(); RNA_TANGLE.forEach(([x, y], i) => i ? ctx.lineTo(x * .8, y * .8) : ctx.moveTo(x * .8, y * .8)); ctx.stroke();
    ctx.restore();
  }
  // envelope lipídico
  bilayer(v.x, v.y, RV, inCell, { sp: 5.6, h: 3.6, hr: 1.75 });
  // espículas gp41/gp120
  for (let k = 0; k < v.nSp; k++) {
    const s = spikeAt(v, k);
    if (inCell(s.base.x, s.base.y)) continue;
    const sa = v.spikeA ? v.spikeA(k) : 1; if (sa <= 0) continue;
    const c = Math.cos(s.a), si = Math.sin(s.a), b0 = polar(v, RV - 3, s.a), b1 = polar(v, RV + 9, s.a);
    ctx.save(); ctx.globalAlpha *= sa;
    ctx.strokeStyle = COL.gp41; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y); ctx.stroke();
    for (const [u, w] of [[2.2, -3], [2.2, 3], [5.6, 0]]) blob(b1.x + c * u - si * w, b1.y + si * u + c * w, 3.1, COL.gp120);
    ctx.restore();
  }
  // capsídeo cônico maduro
  if (mat > 0 && v.capsid !== false) capsid(v.x, v.y, v.rot + (v.capRot || 0), { alpha: mat, rt: 0, scale: lerp(.6, 1, mat) });
  ctx.restore();
}

// ---------- estado da entrada do vírus ----------
const PA = { x: 249.7, y: 404.9 }, PB = { x: 286, y: 389.5 }, PF = { x: 400, y: 392 };
function entryVirus(t) {
  let x, y;
  if (t < 3) { x = lerp(80, 200, ss(0, 3, t)); y = 398 + 6 * Math.sin(t * 2); }
  else if (t < 3.9) { const k = ss(3, 3.9, t); x = lerp(200, PA.x, k); y = lerp(398 + 6 * Math.sin(6), PA.y, k); }
  else if (t < 4.4) { x = PA.x; y = PA.y; }
  else if (t < 5.5) { const k = ss(4.4, 5.0, t); x = lerp(PA.x, PB.x, k); y = lerp(PA.y, PB.y, k); }
  else { const k = ss(5.5, 6.8, t); x = lerp(PB.x, PF.x, k); y = lerp(PB.y, PF.y, k); }
  return { x, y, rot: Math.PI / 10 + 0.9 * (1 - ss(0, 3.9, t)), nSp: 10 };
}
const CAP_PATH = [PF, { x: 705, y: 403 }, { x: 731, y: 400 }];
function budState(th, t0, t) {
  const asm = ss(t0, t0 + .6, t), rise = ss(t0 + .45, t0 + 1.8, t), det = ss(t0 + 1.8, t0 + 2.1, t);
  const drift = Math.max(0, t - (t0 + 2.1));
  const d = lerp(-RV + 5, RV - 1, rise) + 13 * det + 26 * drift;
  const p = polar(C, R + d, th);
  return { x: p.x, y: p.y, rot: th + .25 * drift, dirOut: th, asm, mature: 1 - ss(t0 + 2.4, t0 + 3.4, t), mat: ss(t0 + 2.4, t0 + 3.4, t), escrt: win(t, t0 + 1.25, t0 + 2.05, .2), nSp: 9, vis: t > t0, rise, det };
}

// ---------- célula ----------
function drawCell(t, holes) {
  // citoplasma
  const g = ctx.createRadialGradient(C.x - 120, C.y - 80, 40, C.x, C.y, R);

  // complexo de pré-integração → integração
  let picPos = null;
  if (t >= 9.8) {
    const kp = ss(9.9, 10.8, t);
    const p = kInt > 0 ? { x: 900, y: lerp(426, 440, kInt) } : polyAt([{ x: 738, y: 400 }, PORE_IN, { x: 820, y: 415 }, { x: 900, y: 426 }], kp);
    const L = lerp(40, 70, kInt) + 0.001, amp = lerp(3.5, 5, kInt);
    const a0 = ss(9.8, 10.1, t);
    ctx.save(); ctx.globalAlpha = a0;
    if (kInt <= 0) { ctx.translate(p.x, p.y); ctx.rotate(Math.sin(t * 3) * .12); ctx.translate(-p.x, -p.y); }
    helix(p.x - L / 2, p.x + L / 2, p.y, amp, 0, COL.dna, shade(COL.dna, -50), 'rgba(199,125,255,.6)', 1.8);
    const ia = 1 - ss(11.8, 12.3, t);
    blob(p.x - L / 2 - 2, p.y, 4, COL.in, ia); blob(p.x + L / 2 + 2, p.y, 4, COL.in, ia);
    blob(p.x - L / 2 + 2, p.y - 5, 3.2, COL.in, ia); blob(p.x + L / 2 - 2, p.y + 5, 3.2, COL.in, ia);
    ctx.restore();
    picPos = p;
  }
  // transcrição
  const polA = win(t, 12.0, 13.4, .2);
  const polX = 865 + 70 * (((t - 12) / .6) % 1 + 1) % 1;
  if (polA > 0) {
    squiggle(polX - 2, 432, -2.2, 14, COL.rna, 1.4, t * 8, 1.3, false, polA);
    ctx.save(); ctx.globalAlpha = polA;
    const g = ctx.createRadialGradient(polX - 3, 436, 1, polX, 440, 11); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#94a3b8');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(polX, 440, 11, 8, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
  // mRNAs, ribossomos e cadeias de poliproteínas
  for (let i = 0; i < 6; i++) {
    const s0 = 12.1 + .2 * i, k = ss(s0, s0 + 1.3, t);
    if (t < s0) continue;
    const path = [...NUC_PATH, { x: 760, y: 282 }, RIBS[i]];
    const p = polyAt(path, k);
    const fade = 1 - ss(14.2, 14.7, t);
    squiggle(p.x, p.y, p.a, 18, COL.rna, 1.6, t * 6 + i, 1.6, true, ss(s0, s0 + .15, t) * fade);
    if (k >= 1) {
      blob(RIBS[i].x, RIBS[i].y, 4.5, '#e5e7eb', fade); blob(RIBS[i].x + 3, RIBS[i].y - 3, 3.2, '#cbd5e1', fade);
      const g = ss(s0 + 1.3, s0 + 2.0, t), out = Math.atan2(RIBS[i].y - N.y, RIBS[i].x - N.x);
      const tr = ss(14.0 + .08 * i, 14.9 + .05 * i, t);
      const kind = MRNA_KIND[i];
      if (kind !== 'env') {
        const tgt = polar(BUD_TGT, 6 + i * 2, i * 1.3);
        const cx = lerp(RIBS[i].x, tgt.x, tr), cy = lerp(RIBS[i].y, tgt.y, tr);
        chain(cx, cy, out, Math.round(10 * g), kind, .35 + tr * .3, 1 - ss(15.0, 15.4, t));
      } else {
        const vA = ss(13.9, 14.1, t);
        if (t < 14.1) chain(RIBS[i].x, RIBS[i].y, out, Math.round(10 * g), kind, .3, 1 - vA);
        else {
          const vp = polyAt([RIBS[i], { x: 612, y: 192 }, polar(C, R - 10, TH_BUD + (i === 2 ? .05 : -.05))], ss(14.1, 15.0, t));
          const va = 1 - ss(15.0, 15.25, t);
          ctx.save(); ctx.globalAlpha = va;
          bilayer(vp.x, vp.y, 7, null, { sp: 3.4, h: 2, hr: 1.1, tw: 1 });
          blob(vp.x + 7, vp.y - 3, 2.4, COL.gp120); blob(vp.x - 6, vp.y + 4, 2.4, COL.gp120);
          ctx.restore();
        }
      }
    }
  }
  // RNA genômico (não processado) → membrana
  for (let j = 0; j < 2; j++) {
    const s0 = 13.4 + .15 * j; if (t < s0) continue;
    const p = polyAt([...NUC_PATH, { x: 700, y: 240 }, { x: 560, y: 180 }, polar(BUD_TGT, 5, j * 2)], ss(s0, 15.0 + .1 * j, t));
    squiggle(p.x, p.y, p.a, 26, COL.rna, 1.7, t * 5 + j, 2, true, ss(s0, s0 + .2, t) * (1 - ss(15.1, 15.4, t)));
  }

  // brotamento e novos vírions
  for (const b of buds) {
    const vv = { x: b.x, y: b.y, rot: b.rot, dirOut: b.dirOut + (b.rot - b.dirOut), asm: b.asm, mature: b.mat, nSp: b.nSp, capRot: 0 };
    vv.dirOut = b.rot;
    drawVirion(vv);
    if (b.escrt > 0) {
      const nk = polar(C, R + 1, b.dirOut);
      ctx.save(); ctx.translate(nk.x, nk.y); ctx.rotate(b.dirOut + Math.PI / 2);
      for (let i = 0; i < 4; i++) { ctx.strokeStyle = rgba(COL.escrt, b.escrt * (1 - i * .18)); ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 13 - i * 2.8 - 5 * b.det, 3.2, 0, 0, TAU); ctx.stroke(); }
      ctx.restore();
    }
    if (b.main) {
      // protease cortando Gag
      const pk = win(t, 17.25, 18.2, .2);
      if (pk > 0) {
        const r5 = rng(9);
        for (let i = 0; i < 7; i++) {
          const an = b.rot + r5() * TAU, ph = (t * 2.2 + r5()) % 1, p = polar(b, RV - 16, an);
          ctx.save(); ctx.globalAlpha = pk * Math.sin(ph * Math.PI); ctx.translate(p.x, p.y); ctx.rotate(an);
          ctx.strokeStyle = COL.pr; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(3, 3); ctx.moveTo(-3, 3); ctx.lineTo(3, -3); ctx.stroke();
          ctx.restore();
          blob(p.x + 4, p.y + 4, 2.2, COL.pr, pk);
        }
      }
    }
  }

  // ---------- rótulos ----------
  const L1 = (a, b) => win(t, a, b, .25);
  if (t < 3.1) {
    const vs = { ...v };
    label('gp120', nearestSpike(vs, -2.2).tip, L1(.3, 3.0), -150, -10, COL.gp120);
    label('gp41', polar(nearestSpike(vs, -0.9).base, 4, nearestSpike(vs, -0.9).a), L1(.5, 3.0), 70, -80, COL.gp41);
    label('Envelope lipídico', polar(v, RV, 2.45), L1(.7, 3.0), -130, 70, COL.head);
    label('Matriz (p17)', polar(v, RV - 7.5, 1.55), L1(.9, 3.0), -30, 112, COL.ma);
    label('Capsídeo (p24)', (() => { const r = v.rot + .4 * (1 - ss(0, 3.9, t)); return { x: v.x + Math.cos(r) * -18 - Math.sin(r) * -15, y: v.y + Math.sin(r) * -18 + Math.cos(r) * -15 }; })(), L1(1.1, 3.0), -40, -175, COL.capsid);
    const cr = v.rot + .4 * (1 - ss(0, 3.9, t)), loc = (lx, ly) => ({ x: v.x + Math.cos(cr) * lx - Math.sin(cr) * ly, y: v.y + Math.sin(cr) * lx + Math.cos(cr) * ly });
    label('RNA viral (2 cópias)', loc(10, -4), L1(1.3, 3.0), 175, -20, COL.rna);
    label('Transcriptase reversa', loc(-8, 9), L1(1.5, 3.0), 120, 150, COL.rt);
    label('Integrase', loc(13, 3.5), L1(1.7, 3.0), 200, 60, COL.in);
    label('Protease', loc(-15, -8), L1(1.9, 3.0), -170, -10, COL.pr);
  }
  label('CD4', polar(C, R + 24, TH_CD4), L1(3.1, 5.0), 70, 105, COL.cd4);
  label('Correceptor CCR5', polar(C, R + 6, TH_CCR5), L1(3.6, 5.6), 90, -120, COL.ccr5);
  label('gp120 + CD4', spikeAt(v, 0).tip, L1(3.95, 4.9), -110, 95, COL.gp120);
  label('gp41: peptídeo de fusão', polar(C, R + 4, Math.PI + 0.0), L1(5.15, 6.2), -230, -170, '#ff8fab');
  label('Poro de fusão', polar(C, R, Math.PI + .01), L1(6.1, 6.95), -110, 80, '#ffffff');
  if (capPos) label('Capsídeo no citoplasma', capPos, L1(6.85, 7.7), -40, -95, COL.capsid);
  label('Microtúbulo', { x: 560, y: 412 }, L1(7.4, 8.6), 0, 95, '#86efac');
  label('Poro nuclear', PORE_IN, L1(9.55, 10.5), -70, -105, '#d8b4fe');
  if (capPos) label('Desnudamento', capPos, L1(9.85, 10.45), -60, 95, COL.capsid);
  if (picPos) label('Integrase (IN)', { x: picPos.x + lerp(20, 35, kInt), y: picPos.y }, L1(10.25, 11.7), 70, -85, COL.in);
  label('DNA cromossômico', { x: 1010, y: 444 }, L1(10.4, 12.0), 50, 90, COL.host);
  label('Núcleo', { x: 960, y: 290 }, L1(10.0, 11.4), 40, -60, '#c4b5fd');
  label('Provírus', { x: 900, y: 446 }, L1(11.45, 12.7), -60, 95, COL.dna);
  label('RNA pol II', { x: polX, y: 436 }, L1(12.05, 13.0), 40, -90, '#e2e8f0');
  label('mRNA viral', polyAt([...NUC_PATH, { x: 760, y: 282 }, RIBS[0]], ss(12.1, 13.4, t)), L1(12.5, 13.6), -110, 60, COL.rna);
  label('Ribossomos / RE', RIBS[5], L1(13.25, 14.3), 90, -60, '#e5e7eb');
  label('Gag e Gag-Pol', polar(RIBS[0], 12, Math.atan2(RIBS[0].y - N.y, RIBS[0].x - N.x)), L1(13.55, 14.6), -120, 40, COL.capsid);
  label('Env (gp160) → Golgi', { x: 612, y: 192 }, L1(13.9, 14.9), -110, -70, COL.gp120);
  const mb = buds.find(b => b.main);
  if (mb) {
    label('Gag (MA·CA·NC)', polar(mb, RV - 12, mb.rot + .9), L1(15.2, 16.2), 120, 30, COL.capsid);
    label('gp120/gp41', polar(mb, RV + 12, mb.rot - .5), L1(15.6, 16.6), -130, -40, COL.gp120);
    label('ESCRT', polar(C, R + 1, TH_BUD), L1(16.15, 17.0), 120, 40, COL.escrt);
    label('RNA genômico', polar(mb, 0, 0), L1(15.6, 16.4), 130, -70, COL.rna);
    label('Protease (PR)', polar(mb, RV - 16, mb.rot + 2.2), L1(17.25, 18.15), 120, 60, COL.pr);
    label('Capsídeo cônico', mb, L1(17.95, 18.75), -120, -90, COL.capsid);
    label('Vírion maduro', polar(mb, RV + 6, mb.rot - 1), L1(18.6, 19.9), -40, -70, '#ffffff');
  }
  label('Linfócito T CD4⁺', polar(C, R, deg(-20)), L1(18.8, 20.2), -150, -60, COL.cd4);

  drawRTInset(t, capPos ? toScreen(capPos) : { x: 640, y: 360 });
  drawLabels();
  drawHUD(t);
  // vinheta
  screenT();
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // fade de entrada/saída
  const fa = Math.max(1 - ss(0, .35, t), ss(19.65, 20, t));
  if (fa > 0) { ctx.fillStyle = `rgba(0,0,0,${fa})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;

// reprodução no navegador (desativada quando ?render=1, usado pelo gerador de vídeo)
if (!/render=1/.test(location.search)) {
  let t0 = null;
  const loop = ts => { if (t0 === null) t0 = ts; render(((ts - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
} else render(0);
</script>
</body>
</html>
